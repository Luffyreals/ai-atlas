# CI: type check, unit tests and build (verify), then end-to-end tests (e2e) in 3 shards that reuse
# the dist/ built by verify (docs/architecture/llm-lessons.md section 2.10, E3).
# Runs the same commands as the "Lệnh" table in .claude/CLAUDE.md.
name: CI

on:
  push:
    branches: [main]
    # Files that never reach the site or the tests. Saves minutes of the private-repo quota.
    # "*.md" only matches the repo root; lessons in src/content/docs/ still trigger CI.
    paths-ignore:
      - '*.md'
      - 'LICENSE'
      - 'docs/**'
      - '.claude/**'
      - '.agents/**'
  pull_request:
    paths-ignore:
      - '*.md'
      - 'LICENSE'
      - 'docs/**'
      - '.claude/**'
      - '.agents/**'
  workflow_dispatch:

permissions:
  contents: read

# One run per branch or PR. A new push to a PR cancels the older run.
# On main the running run finishes; a newer push replaces any run still waiting.
# ("queue: max" would keep every main run, but GitHub rejects it with cancel-in-progress: true.)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    # Explicit bash runs with "-eo pipefail", so "npm run build | tee" fails when the build fails.
    shell: bash

jobs:
  verify:
    name: Check, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # CLAUDE.md requires 0 errors and 0 warnings. astro check exits 0 on warnings by default.
      - name: Type check (no warnings allowed)
        run: npm run check -- --minimumFailingSeverity warning

      - name: Unit tests
        run: npm test

      - name: Build (no [WARN] allowed)
        run: |
          npm run build 2>&1 | tee build.log
          if grep -nF '[WARN]' build.log; then
            echo "::error title=Build warnings::astro build printed [WARN] lines (listed above)."
            exit 1
          fi

      # Build once: the e2e shards download this dist/ and only run `astro preview`.
      # dist/ has no dotfiles (checked 10/2026), so include-hidden-files stays at its default (false).
      - name: Upload dist
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 3
          if-no-files-found: error

  e2e:
    name: E2E (Playwright, shard ${{ matrix.shard }}/3)
    needs: verify
    runs-on: ubuntu-latest
    # 2 shards took up to 20 min on the slower shard (10/2026); 3 shards keep each well under this limit.
    timeout-minutes: 30
    strategy:
      # One failing shard must not cancel the other: each shard reports its own failures.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # No browser cache: Playwright docs say restoring it takes about as long as downloading,
      # and the system packages from --with-deps cannot be cached anyway.
      # --only-shell: tests run headless, which uses the Chromium headless shell only.
      - name: Install Chromium
        run: npx playwright install --with-deps --only-shell chromium

      - name: Download dist
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      # E2E_PREBUILT=1: playwright.config.ts skips the build and only starts `astro preview` on dist/.
      # fullyParallel in the config splits the shards test by test, not file by file.
      - name: E2E tests
        run: >-
          npm run test:e2e -- --shard=${{ matrix.shard }}/3 --forbid-only
          --reporter=list,html --trace=retain-on-failure
        env:
          CI: true
          E2E_PREBUILT: 1

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
